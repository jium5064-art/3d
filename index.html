<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE DARK HOUSE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#eee;font-family:Arial}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:18px;left:18px;background:#0009;padding:12px 16px;border-radius:8px;z-index:2}#start{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:5;text-align:center}button{padding:16px 28px;font-size:22px;border:0;border-radius:8px;cursor:pointer}#msg{position:fixed;inset:0;display:none;place-items:center;background:#000b;font-size:44px;z-index:4;text-align:center}#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;border:1px solid #fff;border-radius:50%;margin:-3px;z-index:3}</style></head><body><canvas id="game"></canvas><div id="cross"></div><div id="ui">🕯️ 손전등: <b>F</b><br>🔑 열쇠: <span id="key">없음</span><br>WASD 이동 · SHIFT 달리기 · 마우스 시점</div><div id="start"><div><h1>THE DARK HOUSE</h1><p>어두운 집에서 열쇠를 찾아 탈출하세요.</p><button id="play">▶ 들어가기</button></div></div><div id="msg"></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x020205);scene.fog=new THREE.FogExp2(0x020205,.075);const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,80),r=new THREE.WebGLRenderer({canvas:game,antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;scene.add(new THREE.AmbientLight(0x11111b,.25));const moon=new THREE.DirectionalLight(0x555577,.4);moon.position.set(5,10,2);scene.add(moon);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x17151a,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);function wall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,3,d),new THREE.MeshStandardMaterial({color:0x29252a,roughness:1}));m.position.set(x,1.5,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}wall(0,-9,18,.5);wall(0,9,18,.5);wall(-9,0,.5,18);wall(9,0,.5,18);wall(-4,-4,7,.5);wall(4,1,.5,8);wall(-2,5,5,.5);function cube(x,y,z,s,c){const m=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;scene.add(m)}cube(-6,.5,-6,1,0x4b3028);cube(6,.5,-4,1,0x30353b);cube(5,.5,6,1,0x42312a);const player=new THREE.Object3D();player.position.set(0,1.65,7);scene.add(player);cam.position.set(0,0,0);player.add(cam);let yaw=0,pitch=0,keys={},locked=false,flash=true,hasKey=false,dead=false;const spot=new THREE.SpotLight(0xfff2d0,18,18,Math.PI/8,.55,1.5);spot.position.set(0,0,0);cam.add(spot);cam.add(new THREE.PointLight(0xfff2d0,.7,3));addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyF')flash=!flash;if(e.code==='KeyE'&&hasKey&&player.position.distanceTo(exit.position)<2)win()});addEventListener('keyup',e=>keys[e.code]=0);play.onclick=()=>{document.body.requestPointerLock();start.style.display='none'};document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===document.body);document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch));player.rotation.y=yaw;cam.rotation.x=pitch});const keyObj=new THREE.Mesh(new THREE.BoxGeometry(.35,.12,.18),new THREE.MeshStandardMaterial({color:0xffcc33,emissive:0x553300}));keyObj.position.set(-6,.3,5);scene.add(keyObj);const exit=new THREE.Mesh(new THREE.BoxGeometry(1.4,2.5,.2),new THREE.MeshStandardMaterial({color:0x18291d,emissive:0x071509}));exit.position.set(0,1.25,-8.7);scene.add(exit);const monster=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,8,16),new THREE.MeshStandardMaterial({color:0x050505,roughness:1}));monster.position.set(6,1.1,6);scene.add(monster);const eye1=new THREE.PointLight(0xff0000,2,3);eye1.position.set(-.16,.35,-.42);monster.add(eye1);const eye2=eye1.clone();eye2.position.x=.16;monster.add(eye2);function lose(){if(dead)return;dead=true;msg.innerHTML='☠️ CAUGHT<br><small>새로고침해서 다시 도전</small>';msg.style.display='grid';document.exitPointerLock()}function win(){msg.innerHTML='🚪 ESCAPED!<br><small>탈출 성공!</small>';msg.style.display='grid';document.exitPointerLock();dead=true}let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.033);last=t;if(!dead){const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion),right=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion),v=new THREE.Vector3();if(keys.KeyW)v.add(f);if(keys.KeyS)v.sub(f);if(keys.KeyD)v.add(right);if(keys.KeyA)v.sub(right);if(v.lengthSq())v.normalize();const sp=keys.ShiftLeft?4.8:2.8;player.position.addScaledVector(v,sp*dt);player.position.x=Math.max(-8.3,Math.min(8.3,player.position.x));player.position.z=Math.max(-8.3,Math.min(8.3,player.position.z));if(player.position.distanceTo(keyObj.position)<1.1){hasKey=true;keyObj.visible=false;key.textContent='있음 ✓'}spot.intensity=flash?18:0;const to=player.position.clone().sub(monster.position);const dist=to.length();if(dist<10){to.y=0;to.normalize();monster.position.addScaledVector(to,(dist<3?1.8:1.0)*dt);monster.lookAt(player.position.x,monster.position.y,player.position.z);if(dist<1.1)lose()}}r.render(scene,cam)}requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});</script></body></html>
